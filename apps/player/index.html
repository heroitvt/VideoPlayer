<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LG Video Signage Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: none;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000000;
    }
    .standby-box {
      text-align: center;
      padding: 2rem;
    }
    .pairing-code {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: 0.6rem;
      color: #38bdf8;
      margin: 1.5rem 0;
    }
    .diag-container {
      width: 100vw;
      height: 100vh;
      padding: 2rem;
      overflow-y: auto;
      background: #0f172a;
      cursor: default;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
