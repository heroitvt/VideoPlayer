name: CI/CD Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Test, Build & Deploy (Worker + Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests (Cache Safety, Scheduler, API)
        run: npm test

      - name: Apply D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc2d17eb72d3156c8324b3e26a14efaa
        run: npx wrangler d1 execute lg-signage-db --remote --file=./database/migrations/0001_initial.sql -y

      - name: Deploy Backend Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc2d17eb72d3156c8324b3e26a14efaa
        run: npx wrangler deploy

      - name: Build Admin & TV Player Apps
        env:
          VITE_API_BASE_URL: https://lg-video-signage-api.heroit8x.workers.dev
          VITE_PLAYER_URL: https://vnvc-player.pages.dev
        run: npm run build

      - name: Deploy Admin Dashboard to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc2d17eb72d3156c8324b3e26a14efaa
        run: npx wrangler pages deploy apps/admin/dist --project-name=vnvc-admin --branch=main

      - name: Deploy TV Web Player to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc2d17eb72d3156c8324b3e26a14efaa
        run: npx wrangler pages deploy apps/player/dist --project-name=vnvc-player --branch=main
